# ===== 可插拔扩展配置 =====
# 当前框架（宿主）版本，用于与扩展声明的 requiredFrameworkVersion 做兼容性判定
extension.framework-version=1.2.0

# 启用的扩展实现类全限定名，逗号分隔；也可写成 YAML 列表形式
# 规则：
#   1) 类必须已通过 ExtensionRegistrar 登记到扩展白名单，否则按 UNDECLARED_IMPLEMENTATION 拒绝
#   2) 每个实现必须具备可访问的无参构造器，否则按 INSTANTIATION_FAILED 拒绝
#   3) 类名或扩展 id 重复声明按 DUPLICATE_DECLARATION 拒绝
#   4) 所依赖扩展未同时启用按 MISSING_DEPENDENCY 拒绝并指出缺失对象
#   5) 最低框架版本不满足按 INCOMPATIBLE_VERSION 拒绝
#   6) 依赖关系成环按 CIRCULAR_DEPENDENCY 拒绝并列出环上全部对象
extension.enabled=\
com.github.xingjianluo.springbootpluginscaffoldjava.demo.DemoFeatureExtension,\
com.github.xingjianluo.springbootpluginscaffoldjava.demo.DemoCoreExtension
